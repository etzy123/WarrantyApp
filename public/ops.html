<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bisque Golf — Warranty Claims Ops</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 21V4l12 4.5L11 12" stroke="#F3F8F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Bisque Golf</div>
        <div class="brand-sub">Warranty Claims &middot; Internal Ops</div>
      </div>
    </div>
    <div style="display:flex;gap:8px;">
      <a href="/ops-brands.html" class="btn btn-ghost btn-small">Brand directory &amp; template &rarr;</a>
      <a href="/" class="btn btn-ghost btn-small">Customer portal &rarr;</a>
    </div>
  </header>

  <div class="intro">
    <span class="eyebrow">Internal view</span>
    <h1>Claims queue</h1>
    <p>Where every claim stands, right now.</p>
  </div>

  <div class="section-head">
    <div><h2>Claims</h2><p id="queueCount">&nbsp;</p></div>
  </div>
  <div class="filter-bar">
    <select id="statusFilter">
      <option value="">All statuses</option>
      <option value="submitted">Submitted</option>
      <option value="routed">Routed / sent to brand</option>
      <option value="processing">Processing</option>
      <option value="resolved">Resolved</option>
      <option value="attention">Needs routing</option>
    </select>
    <input type="search" id="claimSearch" placeholder="Search customer, claim ID, order #, or brand…">
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Claim</th><th>Customer</th><th>Brand</th><th>Item</th><th>Photos</th><th>Status</th><th>Updated</th><th></th></tr></thead>
      <tbody id="queueTableBody"><tr><td colspan="8" class="empty-note">Loading…</td></tr></tbody>
    </table>
  </div>
</div>

<div class="modal-backdrop" id="editModalBackdrop">
  <div class="modal-card" id="editModalCard"></div>
</div>

<script src="/ops.js"></script>
</body>
</html>
